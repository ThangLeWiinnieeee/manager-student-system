spring.application.name=student-topic-management

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_topic_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never

# Chỉ tạo tài khoản quản trị mẫu khi ADMIN_PASSWORD được cung cấp.
app.bootstrap.admin-username=${ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
