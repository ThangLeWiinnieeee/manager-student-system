spring.application.name=student-topic-management

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_topic_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.servlet.session.timeout=30m
server.error.include-message=always
server.error.include-stacktrace=always

# Chỉ tạo tài khoản quản trị mẫu khi ADMIN_PASSWORD được cung cấp.
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@fit.edu.vn}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# Luu ngoai thu muc web va source code
app.submission.storage-dir=${REPORT_STORAGE_DIR:./uploads/reports}

# SMTP must be configured before password recovery can send real email.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}
